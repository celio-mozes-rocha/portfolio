version: "3.8"

services:
  portfolio:
    image: portfolio:latest
    container_name: portfolio
    restart: always
    ports:
      - "3000:3000"

  environment:
    - SMTP_HOST=smtp-relay.brevo.com
    - SMTP_PORT=587
    - SMTP_USER=${SMTP_USER}
    - SMTP_PASS=${SMTP_PASS}
    - CONTACT_EMAIL=${CONTACT_EMAIL}