name: Deploy Portfolio

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Build image
      - name: Build portfolio image
        run: |
          docker build \
          --build-arg GIT_COMMIT=$(git rev-parse --short HEAD) \
          --build-arg BUILD_DATE=$(date -u +"%d-%m-%Y") \
          -t portfolio -f Dockerfile.prod .

      # Save image
      - name: Save image
        run: docker save portfolio -o portfolio.tar

      # Setup SSH
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # Copy image & docker-compose
      - name: Copy image and docker-compose to VPS
        run: |
          scp -P ${{ secrets.VPS_PORT }} portfolio.tar \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/

          scp -P ${{ secrets.VPS_PORT }} docker-compose.prod.yml \
          ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/  

      # Deploy on VPS
      - name: Deploy
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
          set -e

          docker-compose -p portfolio -f docker-compose.prod.yml down --remove-orphans          
          docker load -i portfolio.tar

          SMTP_USER="${{ secrets.SMTP_USER }}" \
          SMTP_PASS="${{ secrets.SMTP_PASS }}" \
          CONTACT_EMAIL="${{ secrets.CONTACT_EMAIL }}" 

          docker-compose -p portfolio -f docker-compose.prod.yml up -d --force-recreate

          rm portfolio.tar
          docker image prune -f
          EOF

      # Verify deployment
      - name: Verify deployment
        run: |
          ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e
            sleep 5 && curl -f http://localhost:3000 || (echo "ERROR: Server not responding" && exit 1)
            echo "Deployment successful"
          EOF